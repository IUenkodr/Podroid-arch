name: Podroid Arch Build
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Arch Bootstrap
        run: |
          # The /latest/ alias is broken on many mirrors. 
          # We use the absolute stable path from a different primary mirror.
          # Using mirror.archlinux.org which is usually more consistent.
          URL="https://mirrors.kernel.org/archlinux/iso/20240514/archlinux-bootstrap-x86_64.tar.gz"
          
          echo "Downloading from $URL..."
          curl -L -A "Mozilla/5.0" -o arch-bootstrap.tar.gz "$URL"
          
          if ! file arch-bootstrap.tar.gz | grep -q "gzip compressed data"; then
            echo "Primary mirror failed. Trying fallback mirror..."
            URL="https://archive.archlinux.org/iso/20240514/archlinux-bootstrap-x86_64.tar.gz"
            curl -L -A "Mozilla/5.0" -o arch-bootstrap.tar.gz "$URL"
          fi
          
          if ! file arch-bootstrap.tar.gz | grep -q "gzip compressed data"; then
            echo "All mirrors failed. Content of file:"
            head -n 20 arch-bootstrap.tar.gz
            exit 1
          fi
          echo "Download verified: File is a valid gzip archive."

      - name: Build Arch Rootfs
        run: |
          docker build -t podroid-arch-rootfs -f build-rootfs/Dockerfile.rootfs .
          docker create --name extract podroid-arch-rootfs
          docker cp extract:/arch-rootfs.squashfs app/src/main/assets/qemu/rootfs.squashfs
          docker rm extract

      - name: Grant Gradle Execution Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Arch-APKs
          path: app/build/outputs/apk/**/*.apk
