name: Podroid Arch Build
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Arch Rootfs
        run: |
          docker build -t podroid-arch-rootfs -f build-rootfs/Dockerfile.rootfs .
          docker create --name extract podroid-arch-rootfs
          docker cp extract:/arch-rootfs.squashfs app/src/main/assets/qemu/rootfs.squashfs
          docker rm extract

      - name: Grant Gradle Execution Permission
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          echo "$STORE_BASE64" | base64 --decode > release.jks

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PPODROID_RELEASE_STORE_FILE=${{ github.workspace }}/release.jks \
            -PPODROID_RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PPODROID_RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PPODROID_RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Arch-APKs
          path: app/build/outputs/apk/**/*.apk

