name: Podroid Arch Build
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Arch Bootstrap
        run: |
          curl -L -o arch-bootstrap.tar.gz https://mirrors.edge.kernel.org/archlinux/iso/latest/archlinux-bootstrap-x86_64.tar.gz
          if [ ! -s arch-bootstrap.tar.gz ]; then echo "Download failed"; exit 1; fi

      - name: Build Arch Rootfs
        run: |
          docker build -t podroid-arch-rootfs -f build-rootfs/Dockerfile.rootfs .
          docker create --name extract podroid-arch-rootfs
          docker cp extract:/arch-rootfs.squashfs app/src/main/assets/qemu/rootfs.squashfs
          docker rm extract

      - name: Grant Gradle Execution Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Arch-APKs
          path: app/build/outputs/apk/**/*.apk
