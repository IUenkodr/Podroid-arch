name: Podroid Arch Build
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download Arch Bootstrap
        run: |
          # The bootstrap image is notoriously hard to find via 'latest' on some mirrors.
          # We will use a rotating list of known high-availability mirrors.
          MIRRORS=(
            "https://mirror.rackspace.com/archlinux/iso/latest/archlinux-bootstrap-x86_64.tar.gz"
            "https://mirror.rackspace.com/archlinux/iso/20240514/archlinux-bootstrap-x86_64.tar.gz"
            "https://mirrors.kernel.org/archlinux/iso/latest/archlinux-bootstrap-x86_64.tar.gz"
            "https://archive.archlinux.org/iso/latest/archlinux-bootstrap-x86_64.tar.gz"
          )

          SUCCESS=false
          for URL in "\${MIRRORS[@]}"; do
            echo "Trying mirror: \$URL"
            curl -L -A "Mozilla/5.0" -o arch-bootstrap.tar.gz "\$URL"
            if file arch-bootstrap.tar.gz | grep -q "gzip compressed data"; then
              echo "Successfully downloaded from \$URL"
              SUCCESS=true
              break
            fi
            echo "Mirror failed or returned non-gzip content."
          done

          if [ "\$SUCCESS" = false ]; then
            echo "All mirrors failed. Final attempt at file content:"
            head -n 20 arch-bootstrap.tar.gz
            exit 1
          fi

      - name: Build Arch Rootfs
        run: |
          docker build -t podroid-arch-rootfs -f build-rootfs/Dockerfile.rootfs .
          docker create --name extract podroid-arch-rootfs
          docker cp extract:/arch-rootfs.squashfs app/src/main/assets/qemu/rootfs.squashfs
          docker rm extract

      - name: Grant Gradle Execution Permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Podroid-Arch-APKs
          path: app/build/outputs/apk/**/*.apk
